# Nginx · incluir dentro del bloque server del dominio
# Ajustar root a la ruta real de sitio/.

root /var/www/legado-a-tu-paso/sitio;
index index.html;
error_page 404 /404.html;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://tile.openstreetmap.org; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://api.open-meteo.com; media-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;

# HSTS: activar solo cuando todo el dominio funcione por HTTPS.
# add_header Strict-Transport-Security "max-age=31536000" always;

types {
  text/html                 html;
  text/css                  css;
  text/javascript           js;
  image/webp                webp;
  image/svg+xml             svg;
  font/woff2                woff2;
  audio/wav                 wav;
  audio/mpeg                mp3;
  application/manifest+json webmanifest;
  application/xml           xml;
  text/csv                  csv;
}

gzip on;
gzip_types text/html text/css text/javascript application/xml image/svg+xml application/manifest+json;

location = /404.html {
  internal;
}

location = /sw.js {
  expires -1;
  add_header Cache-Control "no-cache, must-revalidate";
  try_files $uri =404;
}

location ~* \.(css|js|woff2)$ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

location ~* \.(webp|png|svg|jpg|jpeg|ico)$ {
  expires 30d;
  add_header Cache-Control "public, max-age=2592000";
  try_files $uri =404;
}

location ~* \.(wav|mp3|ogg|opus|m4a)$ {
  expires 7d;
  add_header Cache-Control "public, max-age=604800";
  try_files $uri =404;
}

location ~* ^/verificacion/ {
  expires 1h;
  add_header Cache-Control "public, max-age=3600";
  try_files $uri =404;
}

location ~* \.html$ {
  expires -1;
  add_header Cache-Control "public, max-age=0, must-revalidate";
  try_files $uri =404;
}

location / {
  try_files $uri $uri/ =404;
}
