<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta social · Legado a Tu Paso</title>
<style>
  @font-face {
    font-family: "Literata";
    font-style: normal;
    font-weight: 600;
    src: url("../sitio/assets/fuente/literata-600-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Atkinson";
    font-style: normal;
    font-weight: 400;
    src: url("../sitio/assets/fuente/atkinson-400-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Atkinson";
    font-style: normal;
    font-weight: 700;
    src: url("../sitio/assets/fuente/atkinson-700-latin.woff2") format("woff2");
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #faf9f7;
    color: #30160d;
    font-family: "Atkinson", "Segoe UI", sans-serif;
  }

  .tarjeta {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 54px 68px 42px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .logo {
    width: 340px;
    height: auto;
  }

  h1 {
    position: relative;
    z-index: 1;
    margin: 0;
    max-width: 24ch;
    font-family: "Literata", Georgia, serif;
    font-weight: 600;
    font-size: 60px;
    line-height: 1.08;
    letter-spacing: -0.018em;
  }

  h1 span { color: #5e2e1b; }

  .emblema {
    position: absolute;
    right: 34px;
    bottom: 54px;
    width: 300px;
    opacity: 0.1;
  }

  .pie {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    gap: 32px;
    padding-top: 18px;
    border-top: 1px solid #c6c8cb;
    font-size: 19px;
    line-height: 1.3;
    color: #5e2e1b;
  }

  .pie strong { color: #30160d; }
</style>
</head>
<body>
  <div class="tarjeta">
    <img class="logo" src="../sitio/assets/logo.svg" alt="Legado a Tu Paso">
    <h1>Turismo accesible en ciudades Patrimonio. <span>Descúbrelas sin barreras.</span></h1>
    <img class="emblema" src="../sitio/assets/logo-emblema.svg" alt="">
    <p class="pie">
      <span><strong>8 guías completas</strong> · rutas, audio y datos de accesibilidad</span>
      <span>Información orientativa · verificación pendiente</span>
    </p>
  </div>
</body>
</html>
